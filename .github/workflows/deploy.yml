# The old REVIEW link (andy-arrow.github.io/pianotuningscy/) now forwards
# every visitor to the live site, keeping the page they asked for, so nobody
# who kept that link ever sees an outdated copy again. It used to publish a
# noindex preview build of the site; the live site replaced it.
name: Forward the old review link to the live site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build the forwarding pages
        run: |
          mkdir -p forward
          cat > forward/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <title>Piano Tunings Cy — pianotuningscy.com</title>
          <link rel="canonical" href="https://pianotuningscy.com/">
          <script>
            // /pianotuningscy/services/piano-tuning/ → https://pianotuningscy.com/services/piano-tuning/
            var path = location.pathname.replace(/^\/pianotuningscy/, '') || '/';
            location.replace('https://pianotuningscy.com' + path + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://pianotuningscy.com/">
          </head>
          <body>
          <p>Piano Tunings Cy is at <a href="https://pianotuningscy.com/">pianotuningscy.com</a>.</p>
          </body>
          </html>
          HTML
          # GitHub Pages serves 404.html for every other path, so deep links forward too.
          cp forward/index.html forward/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./forward

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
