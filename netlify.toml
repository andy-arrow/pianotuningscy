# Netlify deployment config for Piano Tunings Cy.
# Redirects live in public/_redirects.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Build in Cyprus time (EEST/EET), like everything else on the site.
  TZ = "Asia/Nicosia"

# Security headers — the legacy Wix site set none of these.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    # Deliberately short to begin with. `includeSubDomains` would cover
    # ftp.pianotuningscy.com, which currently serves no valid HTTPS, and
    # `preload` is effectively irreversible. After the site has run correctly
    # for a week or two AND every subdomain you use serves HTTPS, raise this to
    # "max-age=63072000; includeSubDomains" and only then consider preload.
    Strict-Transport-Security = "max-age=300"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://plausible.io https://pianotuningscy-chat.aroditis-andreas.workers.dev; form-action 'self' https://plausible.io; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# The live build id and the cache-clearing beacon must never be cached.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/refresh.txt"
  [headers.values]
    Cache-Control = "no-store"
    Clear-Site-Data = '"cache"'

# Fingerprinted build assets are immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
